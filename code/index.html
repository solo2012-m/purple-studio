<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo.POV — код leads-v5.gs</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{margin:0;background:#0b0b0d;color:#f4f3ef;font:16px/1.6 Inter,system-ui,sans-serif;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:700 24px/1.2 system-ui;margin:0 0 6px}
p{color:#9b9ea4;margin:0 0 16px;font-size:14.5px}
button{background:#ffd400;color:#111;border:0;border-radius:8px;padding:12px 20px;font:600 15px system-ui;cursor:pointer;margin:0 8px 14px 0}
textarea{width:100%;height:60vh;background:#0c0c0e;color:#e8e8e8;border:1px solid #2a2a2e;border-radius:10px;padding:14px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto}
.hint{font-size:13px;color:#9b9ea4;margin-top:10px}
.ok{color:#ffd400}
</style></head><body><div class="wrap">
<h1>Код для Apps Script — leads-v5.gs</h1>
<p>1) «Скопировать код». 2) В Apps Script: Ctrl+A и Ctrl+V. 3) Развернуть → Управление развёртываниями → карандаш → Новая версия → Развернуть.</p>
<button id="btn">Скопировать код</button><span id="msg" class="ok"></span>
<textarea id="ta" spellcheck="false">/**
 * Solo.POV — приём заявок с сайта (v5)
 * Пишет в таблицу "Solo.POV - Zajave", вкладка "Zajave".
 * Клиенту: дружелюбное письмо на его языке (RU/SL), reply-to = info@solopov.si.
 * Владельцу: уведомление о заявке.
 *
 * Изменения v5 (29.10.2026):
 * - убрана ссылка на Telegram из письма клиенту;
 * - вместо неё — просьба просто ответить на письмо;
 * - убрана фраза «письмом, без звонков»;
 * - в письме клиенту не показываются технические названия услуг/анкет;
 * - Reply-To = info@solopov.si (рабочий ящик), тема и текст по согласованному шаблону.
 */

var SHEET_ID = '1o1H8nN0XlcQ-8gCpy_FWuVCP3D9Vk7kJvXeE9HGDKOE';
var TAB = 'Zajave';
var OWNER_EMAIL = 'info@solopov.si';
var BRAND = 'Solo.POV';
var SITE = 'https://solopov.si';

function doGet() {
  return json_({ ok: true, service: 'solopov-leads', version: 5 });
}

function doPost(e) {
  try {
    var lead = {};
    if (e &amp;&amp; e.postData &amp;&amp; e.postData.contents) {
      try { lead = JSON.parse(e.postData.contents); }
      catch (err) { lead = paramsToObject(e.parameter); }
    } else {
      lead = paramsToObject(e.parameter);
    }

    if (lead.hp || lead.honeypot) return json_({ ok: true });
    if (lead.name &amp;&amp; String(lead.name).length &gt; 120) return json_({ ok: true });

    var email = clean(lead.email || lead.e || '');
    var name = clean(lead.name || lead.ime || '');
    var telegram = clean(lead.telegram || lead.tg || '');
    var phone = clean(lead.phone || lead.tel || '');
    var contact = telegram || phone;
    var service = clean(lead.service || lead.interest || lead.branchTitle || lead.type || '');
    var message = clean(lead.message || lead.notes || lead.sporocilo || '');
    var lang = pickLang_(lead.lang, name, message);
    var utm = utmString(lead.utm || {});
    var page = clean(lead.page || lead.url || '');

    var sh = getSheet_();
    sh.appendRow([new Date(), name, email, contact, lang, service, message, utm, page, 'new']);

    notifyOwner_(name, email, contact, lang, service, message, utm, page);
    if (email) sendClient_(email, lang, name);

    return json_({ ok: true });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  }
}

function getSheet_() {
  var ss = SpreadsheetApp.openById(SHEET_ID);
  var sh = ss.getSheetByName(TAB);
  if (!sh) {
    sh = ss.insertSheet(TAB);
    sh.appendRow(['Datum','Ime','E-pošta','Telegram','Jezik','Storitev','Sporočilo','UTM','Stran','Status']);
  }
  sh.setFrozenRows(1);
  return sh;
}

/**
 * Письмо клиенту. Единый шаблон; позже сюда добавляется один абзац
 * в зависимости от типа заявки (personalizacija — пока не включена).
 */
function sendClient_(email, lang, name) {
  var ru = lang === 'ru';
  var subject = ru
    ? 'Solo.POV — спасибо за вашу заявку!'
    : 'Solo.POV — hvala za vaše povpraševanje!';

  var body = ru
    ? ['Здравствуйте! 👋',
       '',
       'Спасибо, что обратились к нам и рассказали о своей задаче!',
       '',
       'Мы получили вашу заявку и с удовольствием изучим ваши пожелания, чтобы предложить решение, которое лучше всего подойдёт именно вам.',
       '',
       'В течение одного рабочего дня мы свяжемся с вами, поделимся нашими предложениями и расскажем о следующих шагах.',
       '',
       'Если у вас появятся дополнительные вопросы или идеи — просто ответьте на это письмо. Мы с радостью вам поможем!',
       '',
       'Будем рады помочь воплотить ваши идеи в жизнь! 💛',
       '',
       'С уважением,',
       'Команда Solo.POV',
       SITE]
    : ['Pozdravljeni! 👋',
       '',
       'Hvala, ker ste se obrnili na nas in nam zaupali svojo idejo!',
       '',
       'Vaše povpraševanje smo uspešno prejeli. Z veseljem bomo preučili vaše želje in poiskali rešitev, ki bo najbolje ustrezala prav vam.',
       '',
       'V enem delovnem dnevu se vam bomo oglasili z našimi predlogi in informacijami o naslednjih korakih.',
       '',
       'Če se vam medtem porodi še kakšno vprašanje ali nova ideja, preprosto odgovorite na to sporočilo. Z veseljem vam bomo pomagali!',
       '',
       'Veselimo se priložnosti, da vam pomagamo uresničiti vaše ideje! 💛',
       '',
       'Lep pozdrav,',
       'Ekipa Solo.POV',
       SITE];

  try {
    MailApp.sendEmail({
      to: email,
      subject: subject,
      body: body.join('\n'),
      name: BRAND,
      replyTo: OWNER_EMAIL
    });
  } catch (err) {}
}

function notifyOwner_(name, email, contact, lang, service, message, utm, page) {
  var body = [
    'Новая заявка',
    'Имя: ' + (name || '-'),
    'Почта: ' + (email || '-'),
    'Контакт: ' + (contact || '-'),
    'Язык: ' + lang,
    'Услуга: ' + (service || '-'),
    'Страница: ' + (page || '-'),
    'UTM: ' + (utm || '-'),
    '',
    'Сообщение:',
    message || '-'
  ].join('\n');
  try {
    MailApp.sendEmail(OWNER_EMAIL, 'SOLO.POV — заявка: ' + (name || email || 'без имени'), body);
  } catch (err) {}
}

/**
 * Язык письма: явный lang=ru, иначе кириллица в имени/сообщении, иначе sl.
 */
function pickLang_(explicit, name, message) {
  if (String(explicit || '').toLowerCase().indexOf('ru') === 0) return 'ru';
  if (/[\u0400-\u04FF]/.test(String(name || '') + ' ' + String(message || ''))) return 'ru';
  return 'sl';
}

function paramsToObject(p) {
  var o = {};
  if (!p) return o;
  Object.keys(p).forEach(function (k) { o[k] = p[k]; });
  return o;
}

function utmString(u) {
  return Object.keys(u || {}).filter(function (k) { return u[k]; })
    .map(function (k) { return k + '=' + u[k]; }).join('&amp;');
}

function clean(v) { return String(v == null ? '' : v).trim().slice(0, 2000); }

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
</textarea>
<div class="hint">Если кнопка не сработала: клик в поле кода → Ctrl+A → Ctrl+C.</div>
<script>
var btn=document.getElementById('btn'),ta=document.getElementById('ta'),msg=document.getElementById('msg');
btn.onclick=function(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
 if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){msg.textContent=' Скопировано';},function(){msg.textContent=' Выделено — нажмите Ctrl+C';});return;}
 msg.textContent=ok?' Скопировано':' Выделено — нажмите Ctrl+C';};
</script>
</div></body></html>
