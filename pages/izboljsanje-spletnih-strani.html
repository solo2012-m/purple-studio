<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Solo.Pov — Izboljšanje spletnih strani</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="create-page improve-page">

<header>
  <div class="wrap hdr">
    <a class="logo" href="../index.html"><img src="../assets/img/logo-mark.png" alt="Solo.Pov" width="1216" height="551"></a>
    <nav>
      <a href="../index.html" data-i18n="create.nav.home"></a>
      <a href="izdelava-spletnih-strani.html" data-i18n="create.nav.create"></a>
      <a href="izboljsanje-spletnih-strani.html" style="color:var(--ink)" data-i18n="create.nav.improve"></a>
      <a href="ai-avtomatizacija.html" data-i18n="create.nav.ai"></a>
    </nav>
    <div class="langbox" style="margin-left:auto">
      <button type="button" data-lang-btn="sl" onclick="SOLO.setLang('sl');renderImprove()">SL</button>
      <button type="button" data-lang-btn="ru" onclick="SOLO.setLang('ru');renderImprove()">RU</button>
    </div>
    <a class="btn ghost sm" href="../index.html" aria-label="Nazaj">&#8592;</a>
  </div>
</header>

<main>
<section class="improve-hero">
  <div class="wrap">
    <span class="eyebrow" data-i18n="improve.eyebrow"></span>
    <h1 class="pricing-title" data-i18n="improve.title"></h1>
    <p class="pricing-lead" data-i18n="improve.sub"></p>
    <div class="entry-grid">
      <a class="entry-card" href="#services">
        <b data-i18n="improve.entry.a.t"></b>
        <span class="entry-desc" data-i18n="improve.entry.a.d"></span>
        <i data-i18n="improve.entry.a.cta"></i>
      </a>
      <button type="button" class="entry-card" onclick="openExpress()">
        <b data-i18n="improve.entry.b.t"></b>
        <span class="entry-desc" data-i18n="improve.entry.b.d"></span>
        <i data-i18n="improve.entry.b.cta"></i>
      </button>
    </div>
  </div>
</section>

<section id="express" class="improve-section improve-section--short">
  <div class="wrap">
    <div class="express-panel">
      <span class="eyebrow" data-i18n="improve.express.eyebrow"></span>
      <h2 data-i18n="improve.express.title"></h2>
      <p class="section-lead" data-i18n="improve.express.desc"></p>
      <form id="expressForm" onsubmit="return submitExpress(event)">
        <div class="grid g2">
          <div class="field">
            <label data-i18n="improve.express.urlLabel"></label>
            <input type="text" id="expressUrl" inputmode="url" placeholder="https://primer.si" data-i18n-ph="improve.express.urlPh">
          </div>
          <div class="field">
            <label data-i18n="improve.express.concernLabel"></label>
            <textarea id="expressConcern" rows="3" data-i18n-ph="improve.express.concernPh"></textarea>
          </div>
        </div>
        <div class="qerr" id="expressErr"></div>
        <button type="submit" class="btn" data-i18n="improve.express.btn"></button>
      </form>
      <div class="notice express-notice" id="expressNotice" hidden>
        <p data-i18n="improve.express.notReady"></p>
        <button type="button" class="btn ghost sm" onclick="requestFromExpress()" data-i18n="improve.express.requestBtn"></button>
      </div>
    </div>
  </div>
</section>

<section id="services" class="improve-section">
  <div class="wrap">
    <div class="improve-head">
      <h2 data-i18n="improve.catalog.title"></h2>
      <p class="section-lead" data-i18n="improve.catalog.sub"></p>
    </div>
    <div id="serviceGrid" class="service-grid"></div>
    <p class="catalog-note" data-i18n="improve.catalog.note"></p>
  </div>
</section>

<section id="request" class="improve-section">
  <div class="wrap">
    <div class="request-panel">
      <div class="request-head">
        <h2 data-i18n="improve.request.title"></h2>
        <span class="request-type" id="requestType"></span>
      </div>
      <div id="selectedList" class="selected-list"></div>
      <p class="request-warning" data-i18n="improve.request.warning"></p>
      <h3 class="request-form-title" data-i18n="improve.request.formTitle"></h3>

      <form id="improveForm" onsubmit="return submitImprove(event)">
        <div class="grid g2">
          <div class="field">
            <label data-i18n="improve.request.siteLabel"></label>
            <input type="text" id="reqUrl" inputmode="url" data-i18n-ph="improve.request.sitePh">
          </div>
          <div class="field">
            <label data-i18n="improve.request.emailLabel"></label>
            <input type="email" id="reqEmail" data-i18n-ph="improve.request.emailPh">
          </div>
        </div>
        <div class="field">
          <label data-i18n="improve.request.commentLabel"></label>
          <textarea id="reqComment" rows="3" data-i18n-ph="improve.request.commentPh"></textarea>
        </div>
        <label class="check"><input type="checkbox" id="reqConsent"><span data-i18n="improve.request.consent"></span></label>
        <small class="consent-note" data-i18n="improve.request.consentNote"></small>
        <a class="privacy-link" href="../privacy.html" target="_blank" rel="noopener" data-i18n="footer.privacy"></a>
        <p class="request-help" data-i18n="improve.request.help"></p>
        <div class="qerr" id="reqErr"></div>
        <button type="submit" class="btn" id="improveSubmit" data-i18n="improve.request.submit"></button>
        <small class="meta" data-i18n="improve.request.note"></small>
      </form>
      <div id="improveResult" class="request-result" hidden></div>
    </div>
  </div>
</section>

<section class="improve-section improve-section--short">
  <div class="wrap">
    <div class="audit-panel">
      <span class="eyebrow" data-i18n="improve.audit.eyebrow"></span>
      <h2 data-i18n="improve.audit.title"></h2>
      <p class="section-lead" data-i18n="improve.audit.sub"></p>
      <div id="auditDirections" class="audit-directions"></div>
      <details class="audit-details">
        <summary data-i18n="improve.audit.detailsTitle"></summary>
        <ul id="auditDetailsList" class="audit-list"></ul>
      </details>
      <p class="audit-price" data-i18n="improve.audit.price"></p>
      <button type="button" class="btn" onclick="startAudit()" data-i18n="improve.audit.btn"></button>
      <small class="meta" data-i18n="improve.audit.note"></small>
    </div>
  </div>
</section>


</main>

<footer>
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0;margin-top:0;padding-top:0">
      <span data-i18n="footer.draft"></span>
      <span>&copy; 2026 Solo.Pov</span>
    </div>
  </div>
</footer>

<div class="firefly" id="firefly" aria-hidden="true"></div>

<script src="../assets/config.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/concept-i18n.js?v=20261024-ai"></script>
<script src="../assets/improve-i18n.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/improve.js"></script>
<script src="../assets/cursor.js"></script>
</body>
</html>
