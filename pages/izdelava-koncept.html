<!doctype html>

<head>

<title>Solo.Pov — Izdelava spletnih strani</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=20261028-rays8">
</head>
<body class="create-page">

<div class="wrap">
  <div class="draftbar"><b data-i18n="create.badge2"></b></div>
</div>

<header>
  <div class="wrap hdr">
    <a class="logo" href="../index.html"><img src="../assets/img/logo-mark.png" alt="Solo.Pov" width="1216" height="551"></a>
    <nav>
      <a href="../index.html" data-i18n="create.nav.home"></a>
      <a href="izdelava-koncept.html" style="color:var(--ink)" data-i18n="create.nav.create"></a>
      <a href="izboljsanje-spletnih-strani.html" data-i18n="create.nav.improve"></a>
      <a href="ai-avtomatizacija.html" data-i18n="create.nav.ai"></a>
    </nav>
    <div class="langbox" style="margin-left:auto">
      <button type="button" data-lang-btn="sl" onclick="SOLO.setLang('sl');renderTariffs()">SL</button>
      <button type="button" data-lang-btn="ru" onclick="SOLO.setLang('ru');renderTariffs()">RU</button>
    </div>
    <a class="btn ghost sm" href="../index.html" aria-label="Nazaj">&#8592;</a>
  </div>
</header>

<main>


<section id="tariffs" class="pricing pricing--top">
  <div class="wrap">
    <div class="pricing-head pricing-head--top">
      <span class="eyebrow" data-i18n="price.eyebrow"></span>
      <h1 class="pricing-title" data-i18n="price.title"></h1>
      <p class="pricing-lead" data-i18n="price.lead"></p>
      <ul class="adv-list">
        <li data-i18n="price.adv1"></li>
        <li data-i18n="price.adv2"></li>
        <li data-i18n="price.adv3"></li>
      </ul>
    </div>
    <div id="tariffCards" class="tariff-grid"></div>

    <div class="pricing-subhead">
      <h3 data-i18n="price.compare"></h3>
      <p data-i18n="price.compareLead"></p>
    </div>
    <div id="tariffCompare"></div>

    <div class="pricing-subhead pricing-subhead--row">
      <div>
        <h3 data-i18n="price.addons"></h3>
        <p data-i18n="price.addonsLead"></p>
      </div>
      <button type="button" class="reset-link" onclick="resetAddons()" data-i18n="price.reset"></button>
    </div>
    <div id="tariffAddons" class="addons-grid"></div>

    <div id="tariffCalc" class="calc-wrap"></div>
    <div id="payinfo" class="payinfo"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0;margin-top:0;padding-top:0">
      <span data-i18n="footer.draft"></span>
      <span>&copy; 2026 Solo.Pov</span>
    </div>
  </div>
</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)SOLO.close()">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" onclick="SOLO.close()" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/concept-i18n.js?v=20261024-ai"></script>
<script src="../assets/tariffs-i18n.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/tariffs.js"></script>
  <script src="../assets/cursor.js"></script>
  <div class="firefly" id="firefly" aria-hidden="true"></div>
