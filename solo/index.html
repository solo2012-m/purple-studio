<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Solo.Pov</title>
<meta name="description" content="">
<link rel="icon" href="assets/img/favicon.png">

<body>

<div class="wrap">
  <div class="draftbar"><b data-i18n="footer.draft"></b> <span data-i18n="meta.desc"></span></div>
</div>

<header>
  <div class="wrap hdr">
    <a class="logo stamp" href="index.html" id="logoStamp">
      <span class="logo-wrap">
        <img src="assets/img/logo-mark.png" alt="Solo.Pov" width="1216" height="551">
        <span class="dust" aria-hidden="true">
            <i style="--dx:26px;--dy:0px;--d:120ms"></i>
            <i style="--dx:29px;--dy:21px;--d:142ms"></i>
            <i style="--dx:14px;--dy:44px;--d:164ms"></i>
            <i style="--dx:-8px;--dy:25px;--d:186ms"></i>
            <i style="--dx:-29px;--dy:21px;--d:208ms"></i>
            <i style="--dx:-46px;--dy:0px;--d:230ms"></i>
            <i style="--dx:-21px;--dy:-15px;--d:252ms"></i>
            <i style="--dx:-11px;--dy:-34px;--d:274ms"></i>
            <i style="--dx:14px;--dy:-44px;--d:296ms"></i>
            <i style="--dx:21px;--dy:-15px;--d:318ms"></i>
        </span>
      </span>
    </a>
    <nav>
      <a href="#solutions" data-i18n="nav.solutions"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#telegram" data-i18n="nav.telegram"></a>
      <a href="#works" data-i18n="nav.works"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="langbox">
      <button type="button" data-lang-btn="sl" onclick="SOLO.setLang('sl')">SL</button>
      <button type="button" data-lang-btn="ru" onclick="SOLO.setLang('ru')">RU</button>
    </div>
    <button class="btn sm" onclick="SOLO.openContact()" data-i18n="cta.talk"></button>
  </div>
</header>

<section class="first" style="padding-top:0">
  <div class="wrap hero">
    <div>
      <span class="eyebrow" data-i18n="hero.eyebrow"></span>
      <h1><span data-i18n="hero.h1a"></span><br><span data-i18n="hero.h1b"></span><br><span class="acc" data-i18n="hero.h1c"></span></h1>
      <p class="sub" data-i18n="hero.sub"></p>
      <div class="actions">
        <button class="btn" onclick="SOLO.startQuiz()" data-i18n="picker.btn"></button>
        <button class="btn ghost" onclick="SOLO.openContact()" data-i18n="cta.talk"></button>
      </div>
    </div>
    <div class="picker">
      <h3 data-i18n="picker.title"></h3>
      <p class="picker-lead" data-i18n="picker.lead"></p>
      <p class="type-line" aria-live="polite"><span id="typeLine"></span><i class="caret" id="typeCaret" aria-hidden="true"></i></p>
      <div class="pick-grid" id="heroPicks">
        <button type="button" class="pick" data-branch="a"><b>01</b><span data-i18n="picker.o1"></span></button>
        <button type="button" class="pick" data-branch="b"><b>02</b><span data-i18n="picker.o2"></span></button>
        <button type="button" class="pick" data-branch="c"><b>03</b><span data-i18n="picker.o3"></span></button>
        <button type="button" class="pick" data-branch="d"><b>04</b><span data-i18n="picker.o4"></span></button>
      </div>
      <small class="meta" data-i18n="picker.meta"></small>
    </div>
  </div>
</section>


<section id="solutions">
  <div class="wrap">
    <h2 class="h2" data-i18n="s3.title"></h2>
    <p class="lead" data-i18n="s3.lead"></p>
    <div class="grid g3">
      <div class="card">
        <div class="ico">A</div><h3 data-i18n="s3.a.t"></h3><p data-i18n="s3.a.d"></p>
        <ul>
          <li data-i18n="s3.a.g1"></li><li data-i18n="s3.a.g2"></li><li data-i18n="s3.a.g3"></li><li data-i18n="s3.a.g4"></li>
        </ul>
        <a class="more" data-route="create" href="#" data-i18n="s3.more"></a>
      </div>
      <div class="card">
        <div class="ico">B</div><h3 data-i18n="s3.b.t"></h3><p data-i18n="s3.b.d"></p>
        <ul>
          <li data-i18n="s3.b.g1"></li><li data-i18n="s3.b.g2"></li><li data-i18n="s3.b.g3"></li><li data-i18n="s3.b.g4"></li>
        </ul>
        <a class="more" data-route="improve" href="#" data-i18n="s3.more"></a>
      </div>
      <div class="card">
        <div class="ico">C</div><h3 data-i18n="s3.c.t"></h3><p data-i18n="s3.c.d"></p>
        <ul>
          <li data-i18n="s3.c.g1"></li><li data-i18n="s3.c.g2"></li><li data-i18n="s3.c.g3"></li><li data-i18n="s3.c.g4"></li>
        </ul>
        <a class="more" data-route="ai" href="#" data-i18n="s3.more"></a>
      </div>
    </div>
  </div>
</section>

<section id="process">
  <div class="wrap">
    <h2 class="h2" data-i18n="s4.title"></h2>
    <p class="lead" data-i18n="s4.lead"></p>
    <div class="timeline">
      <div class="tl"><div class="n">1</div><div class="tb"><h3 data-i18n="s4.s1"></h3></div></div>
      <div class="tl"><div class="n">2</div><div class="tb"><h3 data-i18n="s4.s2"></h3></div></div>
      <div class="tl hi"><div class="n">3</div><div class="tb"><h3 data-i18n="s4.s3"></h3><span class="badge" data-i18n="s4.b1"></span></div></div>
      <div class="tl hi"><div class="n">4</div><div class="tb"><h3 data-i18n="s4.s4"></h3><span class="badge" data-i18n="s4.b2"></span></div></div>
      <div class="tl"><div class="n">5</div><div class="tb"><h3 data-i18n="s4.s5"></h3></div></div>
    </div>
  </div>
</section>

<section id="telegram">
  <div class="wrap">
    <h2 class="h2" data-i18n="s5.title"></h2>
    <p class="lead" data-i18n="s5.lead"></p>
    <div class="demo">
      <div class="panel chat">
        <div class="ph"><i></i><span data-i18n="s5.demo.title"></span></div>
        <div class="pb">
          <div class="who" data-i18n="s5.who.me"></div>
          <div class="msg me on" id="dm1" data-i18n="s5.m1"></div>
          <div class="who r" data-i18n="s5.who.ai"></div>
          <div class="msg ai" id="dm2" data-i18n="s5.m2"></div>
          <div class="who" data-i18n="s5.who.me"></div>
          <div class="msg me" id="dm3" data-i18n="s5.m3"></div>
          <div class="msg act" id="dm4" data-i18n="s5.m4"></div>
          <div class="demo-ctl">
            <button class="btn sm" id="demoBtn" onclick="SOLO.runDemo()" data-i18n="s5.demo.btn"></button>
          </div>
          <div class="demo-note" data-i18n="s5.disclaimer"></div>
        </div>
      </div>
      <div class="panel">
        <div class="ph"><i></i><span data-i18n="s5.demo.step2"></span></div>
        <div class="pb">
          <div class="site">
            <div class="sh"><b data-i18n="s5.site.title"></b><span>solo.pov</span></div>
            <div class="svc on">
              <b data-i18n="s5.site.old"></b>
              <p data-i18n="s5.site.olddesc"></p>
            </div>
            <div class="svc" id="svcCard" style="margin-top:10px">
              <span class="tag" data-i18n="s5.site.new"></span>
              <b data-i18n="s5.site.card"></b>
              <p data-i18n="s5.site.desc"></p>
              <span class="lnk" data-i18n="s5.site.cta"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="grid" style="margin-top:26px">
      <div class="card">
        <h3 data-i18n="s5.card.t"></h3>
        <ul>
          <li data-i18n="s5.card.l1"></li><li data-i18n="s5.card.l2"></li>
          <li data-i18n="s5.card.l3"></li><li data-i18n="s5.card.l4"></li>
        </ul>
      </div>
    </div>
  </div>
</section>

      <details class="faq"><summary data-i18n="s8.q1"></summary><p data-i18n="s8.a1"></p></details>
      <details class="faq"><summary data-i18n="s8.q2"></summary><p data-i18n="s8.a2"></p></details>

  <div class="wrap">
    <h2 data-i18n="s9.title"></h2>

      <button class="btn" onclick="SOLO.startQuiz()" data-i18n="picker.btn"></button>

<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/img/logo-mark.png" alt="Solo.Pov">
        <p data-i18n="footer.desc"></p>
      </div>
      <div>
        <h4 data-i18n="footer.solutions"></h4>
        <a href="pages/izdelava-spletnih-strani.html" data-i18n="s3.a.t"></a>
        <a href="pages/izboljsanje-spletnih-strani.html" data-i18n="s3.b.t"></a>

      </div>
      <div class="fc">
