<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Solo.Pov — Izdelava spletnih strani</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="create-page">

<div class="wrap">
  <div class="draftbar"><b data-i18n="create.badge"></b></div>
</div>

<header>
  <div class="wrap hdr">
    <a class="logo" href="../index.html"><img src="../assets/img/logo-mark.png" alt="Solo.Pov" width="1216" height="551"></a>
    <nav>
      <a href="../index.html" data-i18n="create.nav.home"></a>
      <a href="izdelava-koncept.html" style="color:var(--ink)" data-i18n="create.nav.create"></a>
      <a href="izboljsanje-spletnih-strani.html" data-i18n="create.nav.improve"></a>
      <a href="ai-avtomatizacija.html" data-i18n="create.nav.ai"></a>
    </nav>
    <div class="langbox" style="margin-left:auto">
      <button type="button" data-lang-btn="sl" onclick="SOLO.setLang('sl')">SL</button>
      <button type="button" data-lang-btn="ru" onclick="SOLO.setLang('ru')">RU</button>
    </div>
    <a class="btn ghost sm" href="../index.html" aria-label="Nazaj">&#8592;</a>
  </div>
</header>

<main>
<section class="create-hero">
  <div class="wrap create-hero__grid">
    <div class="create-hero__copy">
      <span class="eyebrow" data-i18n="create.eyebrow"></span>
      <h1 class="create-h1"><span data-i18n="create.h1a"></span><span class="acc" data-i18n="create.h1b"></span></h1>
      <p class="create-sub" data-i18n="create.sub"></p>
      <div class="actions">
        <button type="button" class="btn" onclick="SOLO.startQuiz('a')" data-i18n="create.cta1"></button>
        <button type="button" class="btn ghost" onclick="SOLO.openContact()" data-i18n="create.cta2"></button>
      </div>
      <small class="meta" data-i18n="create.meta"></small>
      <p class="inc-title" data-i18n="create.inc.title"></p>
      <div class="inc-grid">
        <div class="inc"><b data-i18n="create.inc1.t"></b><span data-i18n="create.inc1.d"></span></div>
        <div class="inc"><b data-i18n="create.inc2.t"></b><span data-i18n="create.inc2.d"></span></div>
        <div class="inc"><b data-i18n="create.inc3.t"></b><span data-i18n="create.inc3.d"></span></div>
        <div class="inc"><b data-i18n="create.inc4.t"></b><span data-i18n="create.inc4.d"></span></div>
      </div>
    </div>

    <div class="create-hero__visual">
      <div class="dev-stage" aria-hidden="true">
        <div class="dev-glow"></div>
        <div class="dev-desk"></div>

        <div class="dev-monitor">
          <div class="monitor-screen">
            <div class="monitor-bar"><i></i><i></i><i></i><span>solo.pov</span></div>
            <div class="monitor-in">
              <div class="monitor-nav"><b>SOLO.POV</b><span data-i18n="mock.nav.services"></span><span>01</span><i data-i18n="mock.cta"></i></div>
              <div class="monitor-hero">
                <div class="monitor-copy">
                  <span class="m-eye">01 / 04</span>
                  <h3 data-i18n="mock.hero"></h3>
                  <span class="m-lines"><i></i><i></i></span>
                  <span class="m-btn" data-i18n="mock.cta"></span>
                </div>
                <div class="monitor-art"><span></span><span></span><span></span></div>
              </div>
              <div class="monitor-cards"><div></div><div></div><div></div></div>
            </div>
          </div>
          <div class="monitor-neck"></div><div class="monitor-base"></div>
        </div>

        <div class="dev-laptop">
          <div class="lap-screen">
            <div class="form-ui">
              <b data-i18n="mock.form.t"></b>
              <span class="fld" data-i18n="mock.form.name"></span>
              <span class="fld" data-i18n="mock.form.phone"></span>
              <span class="fld" data-i18n="mock.form.email"></span>
              <span class="fld tall" data-i18n="mock.form.message"></span>
              <span class="fld btn" data-i18n="mock.form.btn"></span>
            </div>
          </div>
          <div class="lap-base"></div>
        </div>

        <div class="dev-tablet">
          <div class="tab-screen">
            <b class="tab-title" data-i18n="mock.services.t"></b>
            <div class="tab-item"><i></i><span data-i18n="mock.services.1"></span></div>
            <div class="tab-item"><i></i><span data-i18n="mock.services.2"></span></div>
            <div class="tab-item"><i></i><span data-i18n="mock.services.3"></span></div>
            <div class="tab-review"><span class="stars">★★★★★</span><i></i><i></i><small data-i18n="mock.review.label"></small></div>
          </div>
        </div>

        <div class="dev-phone">
          <div class="ph-screen">
            <div class="ph-top"></div>
            <div class="ph-brand">SOLO.POV</div>
            <div class="ph-hero"></div>
            <span class="ph-lines"><i></i><i></i></span>
            <span class="ph-btn" data-i18n="mock.phone.cta"></span>
            <div class="ph-card"></div>
          </div>
        </div>

        <div class="dev-toast"><i>&#10003;</i><div><b data-i18n="mock.toast.t"></b><small data-i18n="mock.toast.d"></small></div></div>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0;margin-top:0;padding-top:0">
      <span data-i18n="footer.draft"></span>
      <span>&copy; 2026 Solo.Pov</span>
    </div>
  </div>
</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)SOLO.close()">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" onclick="SOLO.close()" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/concept-i18n.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
